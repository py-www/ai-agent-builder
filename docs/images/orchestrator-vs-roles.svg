<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#FFFFFF"/>

  <rect x="20" y="20" width="350" height="340" rx="14" fill="#FCFCFA" stroke="#D3D1C7"/>
  <text x="195" y="52" text-anchor="middle" font-size="17" font-weight="600" fill="#791F1F">Fixed roles (avoid)</text>
  <text x="195" y="74" text-anchor="middle" font-size="12" fill="#5F5E5A">You design the split in advance</text>
  <rect x="115" y="96" width="160" height="48" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="195" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Orchestrator</text>
  <path d="M195 144 L195 168 L85 168 L85 192" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="195" y1="168" x2="195" y2="192" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M195 168 L305 168 L305 192" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-size="13" font-weight="600" fill="#712B13">
    <rect x="40" y="196" width="90" height="48" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="85" y="225" text-anchor="middle">Research</text>
    <rect x="150" y="196" width="90" height="48" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="195" y="225" text-anchor="middle">Writer</text>
    <rect x="260" y="196" width="90" height="48" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="305" y="225" text-anchor="middle">Editor</text>
  </g>
  <g font-size="13" fill="#444441">
    <text x="45" y="284">• Same split for every task</text>
    <text x="45" y="306">• Role-play adds vocabulary, not skill</text>
    <text x="45" y="328">• Must be redesigned when models improve</text>
  </g>

  <rect x="390" y="20" width="350" height="340" rx="14" fill="#FCFCFA" stroke="#D3D1C7"/>
  <text x="565" y="52" text-anchor="middle" font-size="17" font-weight="600" fill="#085041">Dynamic split (use)</text>
  <text x="565" y="74" text-anchor="middle" font-size="12" fill="#5F5E5A">The orchestrator decides each time</text>
  <rect x="485" y="96" width="160" height="48" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text x="565" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Orchestrator</text>
  <path d="M565 144 L565 168 L455 168 L455 192" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="565" y1="168" x2="565" y2="192" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M565 168 L675 168 L675 192" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <g font-size="13" font-weight="600" fill="#085041">
    <rect x="410" y="196" width="90" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-dasharray="5 4"/>
    <text x="455" y="225" text-anchor="middle">Sub-task</text>
    <rect x="520" y="196" width="90" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-dasharray="5 4"/>
    <text x="565" y="225" text-anchor="middle">Sub-task</text>
    <rect x="630" y="196" width="90" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-dasharray="5 4"/>
    <text x="675" y="225" text-anchor="middle">Sub-task</text>
  </g>
  <g font-size="13" fill="#444441">
    <text x="415" y="284">• Split fits the task in front of it</text>
    <text x="415" y="306">• Temporary sessions, closed when done</text>
    <text x="415" y="328">• Nothing to redesign on model upgrades</text>
  </g>
</svg>
