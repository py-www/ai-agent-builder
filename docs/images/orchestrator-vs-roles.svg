<text x="64" y="78" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="500" fill="#A78BFA" text-anchor="start" letter-spacing="2">02 — ORCHESTRATION</text>
<text x="64" y="128" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#F4F2FF" text-anchor="start" letter-spacing="-0.8">One orchestrator, no fixed roles</text>
<text x="64" y="170" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A1C2" text-anchor="start">Don’t design a cast of agents up front. Let the main session split each task fresh.</text>
<text x="96" y="278" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#F9A8D4" text-anchor="start" letter-spacing="2">AVOID</text>
<text x="96" y="316" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#F4F2FF" text-anchor="start">Fixed roles</text>
<text x="96" y="350" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A1C2" text-anchor="start">You design the split in advance</text>
<text x="344.0" y="424.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F4F2FF" text-anchor="middle">Orchestrator</text>
<text x="344.0" y="447.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A1C2" text-anchor="middle">main session</text>
<text x="160.0" y="592.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FCE7F3" text-anchor="middle">Research</text>
<text x="160.0" y="615.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9A8D4" text-anchor="middle">agent</text>
<text x="344.0" y="592.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FCE7F3" text-anchor="middle">Writer</text>
<text x="344.0" y="615.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9A8D4" text-anchor="middle">agent</text>
<text x="528.0" y="592.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FCE7F3" text-anchor="middle">Editor</text>
<text x="528.0" y="615.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9A8D4" text-anchor="middle">agent</text>
<text x="96" y="700" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F9A8D4" text-anchor="start">✕</text>
<text x="124" y="700" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D9D5EE" text-anchor="start">Same split for every task</text>
<text x="96" y="734" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F9A8D4" text-anchor="start">✕</text>
<text x="124" y="734" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D9D5EE" text-anchor="start">Role-play adds vocabulary, not skill</text>
<text x="96" y="768" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F9A8D4" text-anchor="start">✕</text>
<text x="124" y="768" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D9D5EE" text-anchor="start">Redesign when models improve</text>
<text x="688" y="278" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#C4B5FD" text-anchor="start" letter-spacing="2">USE</text>
<text x="688" y="316" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#F4F2FF" text-anchor="start">Dynamic split</text>
<text x="688" y="350" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A1C2" text-anchor="start">The orchestrator decides each time</text>
<text x="936.0" y="424.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F4F2FF" text-anchor="middle">Orchestrator</text>
<text x="936.0" y="447.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A1C2" text-anchor="middle">main session</text>
<text x="752.0" y="592.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#EDE9FE" text-anchor="middle">Sub-task</text>
<text x="752.0" y="615.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C4B5FD" text-anchor="middle">temporary</text>
<text x="936.0" y="592.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#EDE9FE" text-anchor="middle">Sub-task</text>
<text x="936.0" y="615.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C4B5FD" text-anchor="middle">temporary</text>
<text x="1120.0" y="592.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#EDE9FE" text-anchor="middle">Sub-task</text>
<text x="1120.0" y="615.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C4B5FD" text-anchor="middle">temporary</text>
<text x="688" y="700" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#C4B5FD" text-anchor="start">✓</text>
<text x="716" y="700" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D9D5EE" text-anchor="start">Split fits the task in front of it</text>
<text x="688" y="734" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#C4B5FD" text-anchor="start">✓</text>
<text x="716" y="734" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D9D5EE" text-anchor="start">Sessions close when done</text>
<text x="688" y="768" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#C4B5FD" text-anchor="start">✓</text>
<text x="716" y="768" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#D9D5EE" text-anchor="start">Nothing to redesign on upgrades</text>
</svg>
