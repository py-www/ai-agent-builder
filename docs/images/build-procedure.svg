<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="200" fill="#FFFFFF"/>
  <g font-size="13">
    <rect x="20" y="40" width="120" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="80" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">1. Brief</text>
    <text x="80" y="94" text-anchor="middle" fill="#534AB7">Goal + "good"</text>
    <line x1="140" y1="80" x2="164" y2="80" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="168" y="40" width="120" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="228" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">2. Run once</text>
    <text x="228" y="94" text-anchor="middle" fill="#534AB7">No big setup</text>
    <line x1="288" y1="80" x2="312" y2="80" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="316" y="40" width="120" height="80" rx="10" fill="#FAECE7" stroke="#993C1D"/>
    <text x="376" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">3. Review</text>
    <text x="376" y="94" text-anchor="middle" fill="#993C1D">Attack + judge</text>
    <line x1="436" y1="80" x2="460" y2="80" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="464" y="40" width="120" height="80" rx="10" fill="#FAECE7" stroke="#993C1D"/>
    <text x="524" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">4. Side by side</text>
    <text x="524" y="94" text-anchor="middle" fill="#993C1D">3–5 rounds</text>
    <line x1="584" y1="80" x2="608" y2="80" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="612" y="40" width="128" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="676" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">5. Automate</text>
    <text x="676" y="94" text-anchor="middle" fill="#0F6E56">Connect + schedule</text>
  </g>
  <path d="M676 120 L676 160 L80 160 L80 124" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="378" y="182" text-anchor="middle" font-size="12" fill="#5F5E5A">After each model update: retest and raise the goal one level</text>
</svg>
