<text x="64" y="78" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="500" fill="#A78BFA" text-anchor="start" letter-spacing="2">03 — BUILD PROCEDURE</text>
<text x="64" y="128" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#F4F2FF" text-anchor="start" letter-spacing="-0.8">From brief to automation</text>
<text x="64" y="170" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A1C2" text-anchor="start">Run once, review hard, earn trust side by side, then automate.</text>
<text x="176.0" y="275.7" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#C4B5FD" text-anchor="middle" letter-spacing="1">01</text>
<text x="176.0" y="301.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#EDE9FE" text-anchor="middle">Brief</text>
<text x="176.0" y="324.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C4B5FD" text-anchor="middle">Goal + done criteria</text>
<text x="408.0" y="275.7" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#C4B5FD" text-anchor="middle" letter-spacing="1">02</text>
<text x="408.0" y="301.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#EDE9FE" text-anchor="middle">Run once</text>
<text x="408.0" y="324.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C4B5FD" text-anchor="middle">No big setup first</text>
<text x="640.0" y="275.7" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#F9A8D4" text-anchor="middle" letter-spacing="1">03</text>
<text x="640.0" y="301.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FCE7F3" text-anchor="middle">Review</text>
<text x="640.0" y="324.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9A8D4" text-anchor="middle">Attack + judge</text>
<text x="872.0" y="275.7" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#F9A8D4" text-anchor="middle" letter-spacing="1">04</text>
<text x="872.0" y="301.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FCE7F3" text-anchor="middle">Side by side</text>
<text x="872.0" y="324.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9A8D4" text-anchor="middle">3–5 rounds with you</text>
<text x="1104.0" y="275.7" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#EDE9FE" text-anchor="middle" letter-spacing="1">05</text>
<text x="1104.0" y="301.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">Automate</text>
<text x="1104.0" y="324.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#EDE9FE" text-anchor="middle">Connect + schedule</text>
<text x="640" y="456" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="500" fill="#A78BFA" text-anchor="middle">after each model update: retest, then raise the goal one level</text>
</svg>
