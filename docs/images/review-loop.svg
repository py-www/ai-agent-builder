<text x="64" y="78" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="500" fill="#A78BFA" text-anchor="start" letter-spacing="2">01 — REVIEW LOOP</text>
<text x="64" y="128" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#F4F2FF" text-anchor="start" letter-spacing="-0.8">Maker → Attackers → Judge</text>
<text x="64" y="170" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A1C2" text-anchor="start">No session grades its own work. Fresh sessions attack, a judge filters, the maker revises.</text>
<text x="640.0" y="272.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F4F2FF" text-anchor="middle">Owner</text>
<text x="640.0" y="295.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A1C2" text-anchor="middle">Writes the brief, decides</text>
<text x="260.0" y="456.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F4F2FF" text-anchor="middle">Tools</text>
<text x="260.0" y="479.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A1C2" text-anchor="middle">Browser, connectors, scripts</text>
<text x="640.0" y="456.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#EDE9FE" text-anchor="middle">Maker</text>
<text x="640.0" y="479.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C4B5FD" text-anchor="middle">Does the work</text>
<text x="290.0" y="640.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FCE7F3" text-anchor="middle">Attacker 1</text>
<text x="290.0" y="663.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9A8D4" text-anchor="middle">Prove it wrong</text>
<text x="640.0" y="640.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FCE7F3" text-anchor="middle">Attacker 2</text>
<text x="640.0" y="663.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9A8D4" text-anchor="middle">Prove it wrong</text>
<text x="990.0" y="640.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FCE7F3" text-anchor="middle">Attacker 3</text>
<text x="990.0" y="663.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F9A8D4" text-anchor="middle">Prove it wrong</text>
<text x="640.0" y="872.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#EDE9FE" text-anchor="middle">Judge</text>
<text x="640.0" y="895.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#C4B5FD" text-anchor="middle">Keeps only valid criticism</text>
<text x="640.0" y="1056.6" font-family="'Space Grotesk', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#F4F2FF" text-anchor="middle">Final output</text>
<text x="640.0" y="1079.8" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A1C2" text-anchor="middle">Back to the owner</text>
<text x="980" y="444" font-family="'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="500" fill="#A78BFA" text-anchor="middle">valid feedback only</text>
<text x="64" y="1046" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#EDE9FE" text-anchor="start">Stop signal</text>
<text x="64" y="1070" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A1C2" text-anchor="start">Attackers only find points that are</text>
<text x="64" y="1092" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A1C2" text-anchor="start">“reasonable but miss the point”.</text>
</svg>
