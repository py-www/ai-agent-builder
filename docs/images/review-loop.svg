<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#2C2C2A">Maker → Attackers → Judge</text>

  <g>
    <rect x="270" y="56" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="380" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Owner</text>
    <text x="380" y="99" text-anchor="middle" font-size="12" fill="#5F5E5A">Writes the brief, makes the final call</text>
  </g>
  <line x1="380" y1="112" x2="380" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

  <g>
    <rect x="40" y="150" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="125" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Tools</text>
    <text x="125" y="193" text-anchor="middle" font-size="12" fill="#0F6E56">Browser, connectors, scripts</text>
  </g>
  <line x1="210" y1="178" x2="266" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

  <g>
    <rect x="270" y="150" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="380" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Maker</text>
    <text x="380" y="193" text-anchor="middle" font-size="12" fill="#534AB7">Does the work</text>
  </g>

  <path d="M380 206 L380 232 L190 232 L190 258" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="232" x2="380" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M380 232 L570 232 L570 258" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

  <g font-size="12">
    <rect x="105" y="262" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="190" y="286" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Attacker 1</text>
    <text x="190" y="305" text-anchor="middle" fill="#993C1D">Prove it wrong</text>
    <rect x="295" y="262" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="380" y="286" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Attacker 2</text>
    <text x="380" y="305" text-anchor="middle" fill="#993C1D">Prove it wrong</text>
    <rect x="485" y="262" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="570" y="286" text-anchor="middle" font-size="15" font-weight="600" fill="#712B13">Attacker 3</text>
    <text x="570" y="305" text-anchor="middle" fill="#993C1D">Prove it wrong</text>
  </g>

  <path d="M190 318 L190 342 L380 342" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  <path d="M570 318 L570 342 L380 342" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="380" y1="318" x2="380" y2="368" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>

  <g>
    <rect x="270" y="372" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="380" y="396" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Judge</text>
    <text x="380" y="415" text-anchor="middle" font-size="12" fill="#534AB7">Keeps only valid criticism</text>
  </g>

  <path d="M490 400 L710 400 L710 178 L494 178" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="600" y="168" text-anchor="middle" font-size="12" fill="#534AB7">Valid feedback only</text>

  <line x1="380" y1="428" x2="380" y2="462" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <g>
    <rect x="270" y="466" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="380" y="490" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Final output</text>
    <text x="380" y="509" text-anchor="middle" font-size="12" fill="#5F5E5A">Back to the owner</text>
